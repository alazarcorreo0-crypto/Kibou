<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kibou Fashion - Reloj Checador V5</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex justify-center p-4 selection:bg-pink-500/30">

  <div id="app" class="w-full max-w-md flex flex-col gap-5 pt-6 pb-24">
    
    <div class="flex items-center justify-between mb-1">
      <div>
        <h1 class="text-3xl font-black text-pink-500 tracking-tighter drop-shadow-[0_2px_10px_rgba(236,72,153,0.15)]">Kibou Fashion</h1>
        <p class="text-xs text-zinc-400 font-medium mt-0.5">Control de Asistencia y Nómina VIP</p>
      </div>
      
      <div class="flex flex-col items-end gap-1">
        <label class="text-[9px] font-bold uppercase tracking-wider text-zinc-500">Modo Admin</label>
        <button id="btn-toggle-admin" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs font-bold text-zinc-400 transition-all flex items-center gap-1.5">
          <span id="admin-dot" class="w-2 h-2 rounded-full bg-zinc-600"></span>
          <span id="admin-txt">Trabajador</span>
        </button>
      </div>
    </div>

    <div id="panel-admin-totales" class="hidden flex flex-col gap-4">
      
      <div class="flex bg-zinc-900 p-1 rounded-xl border border-zinc-800">
        <button id="tab-sub-turnos" class="flex-1 py-2 text-xs font-bold rounded-lg bg-pink-600 text-white transition-all">📅 Control de Turnos</button>
        <button id="tab-sub-nomina" class="flex-1 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all">💰 Resumen de Nómina</button>
      </div>

      <div id="vista-admin-turnos" class="flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-0.5 shadow-xl">
            <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500">⏱️ Horas Filtradas</span>
            <span id="total-horas-txt" class="text-2xl font-black text-white mt-1">0.00h</span>
          </div>
          <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-0.5 shadow-xl">
            <span class="text-[10px] font-bold uppercase tracking-wider text-pink-400">💵 Total Neto</span>
            <span id="total-dinero-txt" class="text-2xl font-black text-pink-400 mt-1">$0.00</span>
          </div>
        </div>
      </div>

      <div id="vista-admin-nomina" class="hidden bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-3 shadow-xl">
        <h3 class="text-xs font-bold uppercase tracking-wider text-pink-500">💰 Totales de Nómina a Pagar esta Semana</h3>
        <div id="lista-totales-nomina-empleados" class="flex flex-col gap-2">
          </div>
      </div>

      <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-3 shadow-md">
        <h3 class="text-xs font-bold uppercase tracking-wider text-pink-500">👥 Agregar Colaborador</h3>
        <div class="flex flex-col gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800/60">
          <input type="text" id="nuevo-usuario-input" placeholder="Nombre completo" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2 text-xs text-white outline-none focus:border-pink-500">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="nuevo-pin-input" placeholder="PIN (4 dig)" maxlength="4" class="bg-zinc-900 border border-zinc-800 rounded-lg p-2 text-xs text-center text-white outline-none focus:border-pink-500">
            <input type="number" id="nuevo-sueldo-input" placeholder="Sueldo por Hora ($)" step="0.01" class="bg-zinc-900 border border-zinc-800 rounded-lg p-2 text-xs text-center text-emerald-400 font-bold outline-none focus:border-pink-500">
          </div>
          <button type="button" id="btn-add-user" class="w-full mt-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">➕ Dar de Alta Trabajador</button>
        </div>
        <div class="flex flex-col gap-1.5 max-h-36 overflow-y-auto" id="lista-usuarios-admin"></div>
      </div>
    </div>

    <div id="panel-interfaz-fichaje" class="bg-zinc-900/60 border border-zinc-800/80 p-5 rounded-3xl flex flex-col gap-4 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white tracking-wide">Estación de Fichaje Digital</h2>
        <span id="badge-estado-turno" class="text-[10px] px-2.5 py-1 rounded-full font-bold uppercase bg-zinc-800 text-zinc-400">Consultando...</span>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">👤 Selecciona tu Nombre</label>
        <select id="nombre-select" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white font-semibold outline-none focus:border-pink-500 transition-colors" style="color-scheme: dark;">
          </select>
      </div>

      <div id="wrapper-pin-trabajador">
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">🔒 Ingresa tu PIN Secreto</label>
        <input type="password" id="pin-trabajador-input" placeholder="••••" maxlength="4" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-center text-lg font-mono font-black tracking-widest text-white outline-none focus:border-pink-500 transition-colors">
      </div>

      <div id="opciones-tiempo-admin" class="hidden bg-zinc-950/50 p-3 rounded-xl border border-zinc-800/60">
        <label class="text-[10px] font-bold text-zinc-500 uppercase">Fecha Registro (Admin)</label>
        <input type="date" id="fecha-input" class="w-full bg-zinc-900 text-xs text-white p-2 rounded-lg mt-1" style="color-scheme: dark;">
      </div>

      <div class="mt-1 flex flex-col gap-3">
        <input type="file" id="foto-input" accept="image/*" capture="camera" class="hidden">
        <button type="button" id="btn-accion-fichaje" class="w-full py-4 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-extrabold rounded-2xl text-sm shadow-lg shadow-pink-950/50 transition-all flex items-center justify-center gap-2">
          📸 Capturar Registro
        </button>
        <button type="button" id="btn-enviar-reporte-pdf" class="w-full py-2.5 bg-zinc-900 border border-zinc-800 text-zinc-300 font-bold rounded-xl text-xs flex items-center justify-center gap-2">
          📄 Generar Reporte de Nómina Seguro
        </button>
      </div>

      <div id="preview-container" class="hidden relative rounded-xl overflow-hidden border border-zinc-800">
        <img id="foto-preview" class="w-full h-32 object-cover opacity-60" src="" alt="Captura">
      </div>
    </div>

    <div id="panel-historial-admin" class="hidden flex flex-col gap-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400">📅 Control de la Semana en Curso</h2>
        <button type="button" id="btn-archivar-semana" class="text-[11px] font-bold text-pink-400 bg-pink-950/30 border border-pink-900/50 px-3 py-1.5 rounded-xl">🗄️ Archivar Turnos Semanales</button>
      </div>

      <div id="tabs-trabajadores" class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none"></div>
      <div id="historial-lista" class="flex flex-col gap-2.5"></div>

      <div class="mt-4 border-t border-zinc-800/80 pt-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-500 px-1 mb-2">📁 Archivo Histórico de Semanas Pasadas</h3>
        <div id="lista-semanas-archivadas" class="flex flex-col gap-2"></div>
        
        <div id="desglose-semana-contenedor" class="hidden mt-3 bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <h4 id="desglose-titulo" class="text-xs font-black text-pink-400 uppercase">Detalles Archivados</h4>
            <button onclick="cerrarDesglose()" class="text-zinc-500 font-bold hover:text-white text-xs">✕ Cerrar</button>
          </div>
          <div id="desglose-tabla-lista" class="flex flex-col gap-2 max-h-64 overflow-y-auto"></div>
        </div>
      </div>
    </div>

  </div>

  <canvas id="watermark-canvas" class="hidden"></canvas>

  <script>
    const CLAVE_ADMIN = "1234";
    let esAdmin = false;
    let usuarioSeleccionadoTab = "";
    let subTabActiva = "turnos"; // "turnos" o "nomina"

    // Elementos DOM
    const fechaInput = document.getElementById('fecha-input');
    const nombreSelect = document.getElementById('nombre-select');
    const pinTrabajadorInput = document.getElementById('pin-trabajador-input');
    const wrapperPinTrabajador = document.getElementById('wrapper-pin-trabajador');
    const btnAccionFichaje = document.getElementById('btn-accion-fichaje');
    const btnEnviarReportePdf = document.getElementById('btn-enviar-reporte-pdf');
    const badgeEstadoTurno = document.getElementById('badge-estado-turno');
    const btnArchivarSemana = document.getElementById('btn-archivar-semana');
    const historialLista = document.getElementById('historial-lista');
    const tabsTrabajadores = document.getElementById('tabs-trabajadores');
    const listaSemanasArchivadas = document.getElementById('lista-semanas-archivadas');
    const desgloseSemanaContenedor = document.getElementById('desglose-semana-contenedor');
    const desgloseTitulo = document.getElementById('desglose-titulo');
    const desgloseTablaLista = document.getElementById('desglose-tabla-lista');
    
    const totalHorasTxt = document.getElementById('total-horas-txt');
    const totalDineroTxt = document.getElementById('total-dinero-txt');

    const btnToggleAdmin = document.getElementById('btn-toggle-admin');
    const adminDot = document.getElementById('admin-dot');
    const adminTxt = document.getElementById('admin-txt');
    
    const panelAdminTotales = document.getElementById('panel-admin-totales');
    const panelHistorialAdmin = document.getElementById('panel-historial-admin');
    const opcionesTiempoAdmin = document.getElementById('opciones-tiempo-admin');
    const vistaAdminTurnos = document.getElementById('vista-admin-turnos');
    const vistaAdminNomina = document.getElementById('vista-admin-nomina');
    const listaTotalesNominaEmpleados = document.getElementById('lista-totales-nomina-empleados');
    
    const tabSubTurnos = document.getElementById('tab-sub-turnos');
    const tabSubNomina = document.getElementById('tab-sub-nomina');

    const nuevoUsuarioInput = document.getElementById('nuevo-usuario-input');
    const nuevoPinInput = document.getElementById('nuevo-pin-input');
    const nuevoSueldoInput = document.getElementById('nuevo-sueldo-input');
    const btnAddUser = document.getElementById('btn-add-user');
    const listaUsuariosAdmin = document.getElementById('lista-usuarios-admin');

    const fotoInput = document.getElementById('foto-input');
    const previewContainer = document.getElementById('preview-container');
    const fotoPreview = document.getElementById('foto-preview');
    const watermarkCanvas = document.getElementById('watermark-canvas');

    let fotoProcesadaDataUrl = "";

    const syncFechaHoy = () => { fechaInput.value = new Date().toISOString().slice(0, 10); };
    syncFechaHoy();

    // Carga de bases de datos locales
    let historial = JSON.parse(localStorage.getItem('kb_v5_data') || '[]');
    let usuariosSistema = JSON.parse(localStorage.getItem('kb_v5_users') || '[{"nombre":"Alejandra Pérez","pin":"1111","sueldo":25.00},{"nombre":"Sofía Rodríguez","pin":"2222","sueldo":30.00}]');
    let semanasArchivadas = JSON.parse(localStorage.getItem('kb_v5_archivados') || '[]');

    const getHM = () => {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };

    const getNumeroSemanaAño = (fechaObj) => {
      const d = new Date(Date.UTC(fechaObj.getFullYear(), fechaObj.getMonth(), fechaObj.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };

    // --- SUB-PESTAÑAS ADMINISTRATIVAS ---
    tabSubTurnos.onclick = () => {
      subTabActiva = "turnos";
      tabSubTurnos.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-pink-600 text-white transition-all";
      tabSubNomina.className = "flex-1 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all";
      vistaAdminTurnos.classList.remove('hidden');
      vistaAdminNomina.classList.add('hidden');
      renderApp();
    };

    tabSubNomina.onclick = () => {
      subTabActiva = "nomina";
      tabSubNomina.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-pink-600 text-white transition-all";
      tabSubTurnos.className = "flex-1 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all";
      vistaAdminTurnos.classList.add('hidden');
      vistaAdminNomina.classList.remove('hidden');
      renderApp();
    };

    // --- CONTROL DE PERSONAL POR EL ADMIN ---
    const renderListaUsuariosAdmin = () => {
      listaUsuariosAdmin.innerHTML = usuariosSistema.map((u, i) => `
        <div class="bg-zinc-900 p-2 rounded-xl border border-zinc-800 flex items-center justify-between text-xs">
          <div class="flex flex-col">
            <span class="font-bold text-white">${u.nombre}</span>
            <span class="text-[10px] text-zinc-500 font-mono">PIN: ${u.pin} | $<strong class="text-emerald-400">${parseFloat(u.sueldo).toFixed(2)}/h</strong></span>
          </div>
          <div class="flex gap-1">
            <button onclick="editarUsuario(${i})" class="bg-zinc-800 text-pink-400 px-2 py-1 rounded font-bold">✏️</button>
            <button onclick="eliminarUsuario(${i})" class="bg-zinc-800 text-rose-400 px-2 py-1 rounded font-bold">🗑️</button>
          </div>
        </div>
      `).join('');
      
      nombreSelect.innerHTML = usuariosSistema.map(u => `<option value="${u.nombre}">${u.nombre}</option>`).join('');
      evaluarEstadoEmpleado();
    };

    btnAddUser.onclick = () => {
      const nombre = nuevoUsuarioInput.value.trim();
      const pin = nuevoPinInput.value.trim();
      const sueldo = parseFloat(nuevoSueldoInput.value) || 0;
      if(!nombre || pin.length < 4 || sueldo <= 0) {
        alert("Llena todos los campos correctamente."); return;
      }
      usuariosSistema.push({ nombre, pin, sueldo });
      localStorage.setItem('kb_v5_users', JSON.stringify(usuariosSistema));
      nuevoUsuarioInput.value = ""; nuevoPinInput.value = ""; nuevoSueldoInput.value = "";
      renderListaUsuariosAdmin(); renderApp();
    };

    window.eliminarUsuario = (index) => {
      if(confirm(`¿Remover a ${usuariosSistema[index].nombre}?`)) {
        usuariosSistema.splice(index, 1);
        localStorage.setItem('kb_v5_users', JSON.stringify(usuariosSistema));
        renderListaUsuariosAdmin(); renderApp();
      }
    };

    window.editarUsuario = (index) => {
      const user = usuariosSistema[index];
      const nNombre = prompt("Modificar nombre completo:", user.nombre);
      const nPin = prompt("Modificar PIN:", user.pin);
      const nSueldo = prompt("Modificar Sueldo por Hora:", user.sueldo);
      if(nNombre && nPin && nSueldo) {
        usuariosSistema[index] = { nombre: nNombre.trim(), pin: nPin.trim(), sueldo: parseFloat(nSueldo) || 0 };
        localStorage.setItem('kb_v5_users', JSON.stringify(usuariosSistema));
        renderListaUsuariosAdmin(); renderApp();
      }
    };

    const evaluarEstadoEmpleado = () => {
      const empleado = nombreSelect.value;
      const turnoAbierto = historial.find(item => item.nombre === empleado && !item.salida);
      if (turnoAbierto) {
        badgeEstadoTurno.innerText = "Turno Abierto";
        badgeEstadoTurno.className = "text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 font-bold";
        btnAccionFichaje.innerText = "📸 Registrar Salida";
      } else {
        badgeEstadoTurno.innerText = "Fuera de Turno";
        badgeEstadoTurno.className = "text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 font-bold";
        btnAccionFichaje.innerText = "📸 Registrar Entrada";
      }
    };

    nombreSelect.onchange = evaluarEstadoEmpleado;

    // --- ACCIÓN DE FICHAJE ---
    btnAccionFichaje.onclick = () => {
      const emp = nombreSelect.value;
      const dataUser = usuariosSistema.find(u => u.nombre === emp);
      if(!dataUser) return;

      // Si no es admin, validar PIN. Si es admin, puede fichar sin restricción.
      if(!esAdmin && pinTrabajadorInput.value !== dataUser.pin) {
        alert("🔒 PIN incorrecto."); return;
      }
      fotoInput.click();
    };

    fotoInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const empleado = nombreSelect.value;
      const user = usuariosSistema.find(u => u.nombre === empleado);
      const turnoAbierto = historial.find(item => item.nombre === empleado && !item.salida);

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const ctx = watermarkCanvas.getContext('2d');
          watermarkCanvas.width = 400; watermarkCanvas.height = 300;
          ctx.drawImage(img, 0, 0, 400, 300);

          const horaFichada = getHM();
          const fechaFichada = fechaInput.value;

          ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
          ctx.fillRect(0, 275, 400, 25);
          ctx.fillStyle = "#ec4899";
          ctx.font = "bold 10px monospace";
          ctx.fillText(`KIBOU FASHION - ${horaFichada} | ${empleado}`, 10, 291);

          const fotoURL = watermarkCanvas.toDataURL('image/jpeg', 0.7);

          if (!turnoAbierto) {
            historial.unshift({
              id: Date.now(),
              nombre: empleado,
              fecha: fechaFichada,
              entrada: horaFichada,
              salida: "",
              tarifaHistorica: user ? user.sueldo : 22.01,
              fotoEntrada: fotoURL,
              fotoSalida: "",
              pagado: false
            });
            alert(`✅ Entrada grabada (${horaFichada}).`);
          } else {
            turnoAbierto.salida = horaFichada;
            turnoAbierto.fotoSalida = fotoURL;
            alert(`🛑 Salida grabada (${horaFichada}).`);
          }

          pinTrabajadorInput.value = "";
          evaluarEstadoEmpleado();
          renderApp();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // --- ACCESO Y SEGURIDAD ROL ADMIN ---
    btnToggleAdmin.onclick = () => {
      if (!esAdmin) {
        const pass = prompt("Clave Maestra:");
        if (pass === CLAVE_ADMIN) { esAdmin = true; actualizarModo(); } else { alert("Error."); }
      } else { esAdmin = false; actualizarModo(); }
    };

    const actualizarModo = () => {
      if (esAdmin) {
        adminDot.className = "w-2 h-2 rounded-full bg-pink-500 animate-pulse";
        adminTxt.innerText = "Administrador"; adminTxt.className = "text-pink-400";
        panelAdminTotales.classList.remove('hidden');
        panelHistorialAdmin.classList.remove('hidden');
        opcionesTiempoAdmin.classList.remove('hidden');
        wrapperPinTrabajador.classList.add('hidden'); // Admin no necesita poner PIN para simular turnos o ver horas
      } else {
        adminDot.className = "w-2 h-2 rounded-full bg-zinc-600";
        adminTxt.innerText = "Trabajador"; adminTxt.className = "text-zinc-400";
        panelAdminTotales.classList.add('hidden');
        panelHistorialAdmin.classList.add('hidden');
        opcionesTiempoAdmin.classList.add('hidden');
        wrapperPinTrabajador.classList.remove('hidden');
        syncFechaHoy();
      }
      renderApp();
    };

    // --- RENDER COMPLETO DE HISTORIALES Y NÓMINAS ---
    const renderApp = () => {
      localStorage.setItem('kb_v5_data', JSON.stringify(historial));
      localStorage.setItem('kb_v5_archivados', JSON.stringify(semanasArchivadas));

      if (!esAdmin) return;

      // 1. Pestaña de Nómina General: Agrupar totales por empleado (Punto 5)
      let resumenNominaHtml = "";
      usuariosSistema.forEach(u => {
        let totalHorasEmp = 0, totalDineroEmp = 0;
        historial.filter(h => h.nombre === u.nombre && h.salida).forEach(item => {
          const [eH, eM] = item.entrada.split(':').map(Number);
          const [sH, sM] = item.salida.split(':').map(Number);
          let diffMin = (sH * 60 + sM) - (eH * 60 + eM);
          if (diffMin < 0) diffMin += 24 * 60; // Tratar cruce de medianoche
          const horasNetas = diffMin / 60;
          totalHorasEmp += horasNetas;
          totalDineroEmp += horasNetas * item.tarifaHistorica;
        });

        resumenNominaHtml += `
          <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex items-center justify-between text-xs">
            <div>
              <span class="font-extrabold text-white text-sm block">${u.nombre}</span>
              <span class="text-zinc-500 font-bold block mt-0.5">Jornada semanal acumulada: ${totalHorasEmp.toFixed(2)}h</span>
            </div>
            <div class="text-right">
              <span class="text-base font-black text-emerald-400 block">$${totalDineroEmp.toFixed(2)}</span>
              <span class="text-[10px] text-zinc-500 font-mono block">Tarifa: $${u.sueldo}/h</span>
            </div>
          </div>
        `;
      });
      listaTotalesNominaEmpleados.innerHTML = resumenNominaHtml || `<p class="text-xs text-zinc-500 text-center">No hay personal registrado.</p>`;

      // 2. Render de Semanas Archivadas (Punto 3)
      listaSemanasArchivadas.innerHTML = semanasArchivadas.map((sem, idx) => `
        <div class="bg-zinc-900/40 border border-zinc-800 rounded-xl p-3 flex flex-col gap-1 text-xs">
          <div class="flex items-center justify-between font-bold text-zinc-300">
            <span class="text-pink-400">📅 Semana #${sem.numSemana} (Año)</span>
            <button onclick="verDesgloseSemana(${idx})" class="text-[11px] bg-zinc-800 hover:bg-pink-600 text-white px-2.5 py-1 rounded-lg transition-all font-bold">🔍 Ver Desglose</button>
          </div>
          <p class="text-[11px] text-zinc-500 mt-0.5">Cerrada el ${sem.fechaCierre} con ${sem.datosTurnos.length} registros totales.</p>
        </div>
      `).join('');

      // 3. Pestañas de Turnos Activos
      const listadoNombresConDatos = [...new Set(historial.map(item => item.nombre))];
      if (listadoNombresConDatos.length > 0 && !usuarioSeleccionadoTab) {
        usuarioSeleccionadoTab = listadoNombresConDatos[0];
      }

      // El admin puede hacer clic en las pestañas y ver horas libremente (Punto 4)
      tabsTrabajadores.innerHTML = listadoNombresConDatos.map(t => {
        const activeClass = usuarioSeleccionadoTab === t ? 'bg-pink-600 text-white border-pink-500' : 'bg-zinc-900 text-zinc-400 border-zinc-800';
        return `<button onclick="cambiarTab('${t}')" class="px-3 py-1.5 text-xs font-extrabold rounded-xl border ${activeClass} whitespace-nowrap">${t}</button>`;
      }).join('');

      const filtrados = historial.filter(item => item.nombre === usuarioSeleccionadoTab);
      historialLista.innerHTML = '';
      let totalHorasFiltro = 0, totalDineroFiltro = 0;

      if (filtrados.length === 0) {
        historialLista.innerHTML = `<div class="bg-zinc-900/30 border border-dashed border-zinc-800/60 rounded-2xl p-6 text-center text-xs text-zinc-600 font-medium">Sin registros guardados.</div>`;
      } else {
        filtrados.forEach((item) => {
          let horasNetas = 0;
          let pagoDia = 0;

          if (item.entrada && item.salida) {
            const [eH, eM] = item.entrada.split(':').map(Number);
            const [sH, sM] = item.salida.split(':').map(Number);
            
            // CORRECCIÓN PUNTO 1: Si horas son iguales es 0 exacto.
            let diffMin = (sH * 60 + sM) - (eH * 60 + eM);
            if (diffMin < 0) diffMin += 24 * 60;
            
            horasNetas = diffMin / 60;
            totalHorasFiltro += horasNetas;
            pagoDia = horasNetas * (item.tarifaHistorica || 22.01);
            totalDineroFiltro += pagoDia;
          }

          const [y, m, d] = item.fecha.split('-');
          const fechaFormato = new Date(y, m - 1, d).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });

          historialLista.innerHTML += `
            <div class="bg-zinc-900/50 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-3 relative shadow-sm">
              <div class="absolute left-0 top-0 bottom-0 w-1 ${item.salida ? 'bg-pink-500' : 'bg-amber-500'}"></div>
              <div class="flex items-start justify-between pl-2">
                <div>
                  <span class="text-xs font-black text-white capitalize">${fechaFormato}</span>
                  <label class="inline-flex items-center gap-1.5 ml-3 bg-zinc-950 px-2 py-0.5 rounded border border-zinc-800 cursor-pointer">
                    <input type="checkbox" ${item.pagado ? 'checked' : ''} onclick="togglePagoDia(${item.id})" class="accent-pink-500 w-3 h-3">
                    <span class="text-[9px] font-black ${item.pagado ? 'text-emerald-400' : 'text-zinc-500'}">${item.pagado ? 'PAGADO ✅' : 'PENDIENTE'}</span>
                  </label>
                  <div class="flex gap-3 text-[10px] text-zinc-400 mt-1 font-bold">
                    <span>In: <strong class="text-pink-400">${item.entrada}</strong></span>
                    <span>Out: <strong class="text-purple-400">${item.salida || 'Abierto'}</strong></span>
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-sm font-black text-emerald-400 block">$${pagoDia.toFixed(2)}</span>
                  <span class="text-[10px] text-zinc-500 font-bold block">${horasNetas.toFixed(2)} hrs</span>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2 pl-2">
                <img src="${item.fotoEntrada}" class="w-full h-20 object-cover rounded-lg border border-zinc-800">
                ${item.fotoSalida ? `<img src="${item.fotoSalida}" class="w-full h-20 object-cover rounded-lg border border-zinc-800">` : `<div class="w-full h-20 bg-zinc-950 border border-dashed border-zinc-800 rounded-lg flex items-center justify-center text-[9px] text-zinc-600 font-bold">Pendiente</div>`}
              </div>
              <div class="flex justify-end gap-2 text-[10px]">
                <button onclick="modificarRegistroManualAdmin(${item.id})" class="bg-zinc-800 text-zinc-300 font-bold px-2.5 py-1 rounded hover:bg-zinc-700">✏️ Editar Turno</button>
                <button onclick="removerRegistro(${item.id})" class="bg-zinc-800/40 text-rose-500 font-bold px-2 py-1 rounded">Eliminar</button>
              </div>
            </div>
          `;
        });
      }

      totalHorasTxt.innerText = `${totalHorasFiltro.toFixed(2)}h`;
      totalDineroTxt.innerText = `$${totalDineroFiltro.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
    };

    window.cambiarTab = (n) => { usuarioSeleccionadoTab = n; renderApp(); };

    window.togglePagoDia = (id) => {
      const r = historial.find(item => item.id === id);
      if(r) { r.pagado = !r.pagado; renderApp(); }
    };

    // MODIFICACIÓN DE HORAS COMPLETA POR ADMIN (Punto 2)
    window.modificarRegistroManualAdmin = (id) => {
      const r = historial.find(item => item.id === id);
      if(!r) return;
      const nFecha = prompt("Modificar Fecha (AAAA-MM-DD):", r.fecha);
      const nIn = prompt("Modificar hora ENTRADA (HH:MM):", r.entrada);
      const nOut = prompt("Modificar hora SALIDA (HH:MM):", r.salida);
      
      if(nFecha) r.fecha = nFecha;
      if(nIn !== null) r.entrada = nIn;
      if(nOut !== null) r.salida = nOut;
      renderApp();
    };

    window.removerRegistro = (id) => {
      if(confirm("¿Remover asistencia?")){
        historial = historial.filter(item => item.id !== id);
        renderApp();
      }
    };

    // --- INTERACTIVIDAD DESGLOSE SEMANAS PASADAS (Punto 3) ---
    window.verDesgloseSemana = (idx) => {
      const sem = semanasArchivadas[idx];
      desgloseTitulo.innerText = `🔍 Desglose Semana #${sem.numSemana} (Año)`;
      
      if(!sem.datosTurnos || sem.datosTurnos.length === 0) {
        desgloseTablaLista.innerHTML = `<p class="text-xs text-zinc-500 text-center py-2">No se guardaron registros detallados en este bloque.</p>`;
      } else {
        desgloseTablaLista.innerHTML = sem.datosTurnos.map(t => {
          return `
            <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-800 flex flex-col gap-1 text-[11px]">
              <div class="flex items-center justify-between">
                <span class="font-bold text-white text-xs">${t.nombre}</span>
                <span class="text-zinc-500">${t.fecha}</span>
              </div>
              <div class="flex items-center justify-between text-zinc-400 text-[10px]">
                <span>In: <strong>${t.entrada}</strong> | Out: <strong>${t.salida || '--:--'}</strong></span>
                <span class="${t.pagado ? 'text-emerald-400 font-bold' : 'text-zinc-600'}">${t.pagado ? 'Liquidado ✅' : 'No marcado'}</span>
              </div>
            </div>
          `;
        }).join('');
      }
      desgloseSemanaContenedor.classList.remove('hidden');
    };

    window.cerrarDesglose = () => { desgloseSemanaContenedor.classList.add('hidden'); };

    // Archivar semana en curso
    btnArchivarSemana.onclick = () => {
      if(historial.length === 0) { alert("Sin turnos activos."); return; }
      if(confirm("¿Cerrar y archivar los balances semanales actuales?")){
        const numSem = getNumeroSemanaAño(new Date());
        semanasArchivadas.unshift({
          archivoId: Date.now(),
          numSemana: numSem,
          fechaCierre: new Date().toLocaleDateString('es-MX'),
          datosTurnos: historial
        });
        historial = [];
        usuarioSeleccionadoTab = "";
        cerrarDesglose();
        renderApp();
        alert("Semana cerrada.");
      }
    };

    // Impresión de comprobante seguro
    btnEnviarReportePdf.onclick = () => {
      const emp = nombreSelect.value;
      const turnos = historial.filter(item => item.nombre === emp && item.salida);
      if(turnos.length === 0) { alert("Sin jornadas completas en la semana."); return; }
      
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html><body style="font-family:monospace;padding:20px;">
          <h2>KIBOU FASHION</h2><hr>
          <p><strong>Colaborador:</strong> ${emp}</p>
          <ul>${turnos.map(t => `<li>Fecha: ${t.fecha} | Entrada: ${t.entrada} -> Salida: ${t.salida}</li>`).join('')}</ul>
          <script>window.print();<\/script>
        </body></html>
      `);
      printWindow.document.close();
    };

    renderListaUsuariosAdmin();
    actualizarModo();
  </script>
</body>
</html>
