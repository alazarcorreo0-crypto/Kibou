<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TimeTracker Pro - Empresa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex justify-center p-4 selection:bg-indigo-500/30">

  <div id="app" class="w-full max-w-md flex flex-col gap-5 pt-6 pb-24">
    
    <div class="flex items-center justify-between mb-1">
      <div>
        <h1 class="text-2xl font-black text-white tracking-tight">TimeTracker</h1>
        <p class="text-xs text-zinc-500 mt-0.5">Control de Turnos · Sistema Empresarial</p>
      </div>
      
      <div class="flex flex-col items-end gap-1">
        <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-500">Modo Admin</label>
        <button id="btn-toggle-admin" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs font-bold text-zinc-400 transition-all flex items-center gap-1.5">
          <span id="admin-dot" class="w-2 h-2 rounded-full bg-zinc-600"></span>
          <span id="admin-txt">Trabajador</span>
        </button>
      </div>
    </div>

    <div id="panel-admin-totales" class="hidden flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-0.5 shadow-xl">
          <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500">⏱️ Horas Totales</span>
          <span id="total-horas-txt" class="text-2xl font-black text-white mt-1">0.00h</span>
        </div>
        <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-0.5 shadow-xl">
          <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-500">💵 Total Neto</span>
          <span id="total-dinero-txt" class="text-2xl font-black text-emerald-400 mt-1">$0.00</span>
        </div>
      </div>

      <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-3 shadow-md">
        <div class="flex items-center justify-between text-sm">
          <span class="text-zinc-400 font-medium">Pago por hora (Configuración):</span>
          <div class="flex items-center gap-1 bg-zinc-950 px-3 py-1.5 rounded-xl border border-zinc-800">
            <span class="text-zinc-500 font-bold">$</span>
            <input type="number" id="tarifa-input" value="22.01" step="0.01" class="bg-transparent text-emerald-400 font-black text-right w-16 outline-none">
            <span class="text-zinc-600 font-medium text-xs ml-1">/ hr</span>
          </div>
        </div>
        <hr class="border-zinc-800/80">
        <div>
          <label class="block text-[10px] font-bold text-zinc-500 mb-1 uppercase tracking-wider">Añadir Nuevo Usuario al Sistema</label>
          <div class="flex gap-2">
            <input type="text" id="nuevo-usuario-input" placeholder="Nombre de trabajador" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-xs text-white outline-none">
            <button type="button" id="btn-add-user" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 rounded-xl text-xs">Agregar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-zinc-900/60 border border-zinc-800/80 p-5 rounded-3xl flex flex-col gap-4 shadow-xl">
      <h2 class="text-sm font-bold text-white tracking-wide">Fichaje de Turno Diario</h2>

      <div>
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">👤 Selecciona tu Nombre</label>
        <select id="nombre-select" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white font-semibold outline-none focus:border-indigo-500 transition-colors" style="color-scheme: dark;">
          </select>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">Fecha de Registro</label>
        <input type="date" id="fecha-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white font-semibold outline-none transition-colors" style="color-scheme: dark;" disabled>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">📸 Foto Obligatoria de Entrada</label>
        <div class="flex flex-col gap-2">
          <input type="file" id="foto-input" accept="image/*" capture="camera" class="hidden">
          <button type="button" id="btn-tomar-foto" class="w-full py-3 bg-zinc-950 border border-dashed border-zinc-700 text-indigo-400 font-bold rounded-xl text-xs hover:border-indigo-500 transition-all flex items-center justify-center gap-2">
            📷 Capturar Foto para Registrar Entrada
          </button>
          
          <div id="preview-container" class="hidden relative rounded-xl overflow-hidden border border-zinc-800">
            <img id="foto-preview" class="w-full h-44 object-cover" src="" alt="Evidencia">
            <div class="absolute bottom-0 inset-x-0 bg-black/80 p-2 text-[10px] text-zinc-300 font-mono">
              <span id="watermark-text-preview"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">🛫 Hora Entrada</label>
          <input type="time" id="entrada-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-center text-sm font-bold text-zinc-400 outline-none" style="color-scheme: dark;" disabled>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">🛬 Hora Salida</label>
          <div class="flex gap-1 bg-zinc-950 border border-zinc-800 rounded-xl p-1">
            <input type="time" id="salida-input" class="w-full bg-transparent p-2 text-center text-sm font-bold text-white outline-none" style="color-scheme: dark;" disabled>
            <button type="button" id="btn-now-salida" class="bg-rose-600/20 border border-rose-500/30 text-rose-400 font-bold px-2 rounded-lg text-xs">⏹️ Marcar</button>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">☕ Descanso / Break</label>
        <div class="flex items-center bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5">
          <input type="number" id="descanso-input" value="30" min="0" class="flex-1 bg-transparent text-sm font-bold text-white outline-none">
          <span class="text-zinc-600 text-xs font-semibold">minutos</span>
        </div>
      </div>

      <button type="button" id="btn-guardar" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-950 transition-all active:scale-[0.97] mt-1 flex items-center justify-center gap-2">
        📥 Guardar y Enviar Turno
      </button>
    </div>

    <div id="panel-historial-admin" class="hidden flex flex-col gap-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-zinc-400">📅 Control de Asistencias Semanal</h2>
        <button type="button" id="btn-archivar-semana" class="text-[11px] font-bold text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-2 py-1 rounded-lg">🗄️ Archivar Semana</button>
      </div>

      <div id="tabs-trabajadores" class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
        </div>
      
      <div id="historial-lista" class="flex flex-col gap-2"></div>
    </div>

  </div>

  <canvas id="watermark-canvas" class="hidden"></canvas>

  <script>
    const CLAVE_ADMIN = "1234";
    let esAdmin = false;
    let usuarioSeleccionadoTab = "";

    // Elementos DOM
    const tarifaInput = document.getElementById('tarifa-input');
    const fechaInput = document.getElementById('fecha-input');
    const entradaInput = document.getElementById('entrada-input');
    const salidaInput = document.getElementById('salida-input');
    const descansoInput = document.getElementById('descanso-input');
    const nombreSelect = document.getElementById('nombre-select');
    const btnGuardar = document.getElementById('btn-guardar');
    const btnArchivarSemana = document.getElementById('btn-archivar-semana');
    const historialLista = document.getElementById('historial-lista');
    const tabsTrabajadores = document.getElementById('tabs-trabajadores');
    
    const totalHorasTxt = document.getElementById('total-horas-txt');
    const totalDineroTxt = document.getElementById('total-dinero-txt');

    const btnToggleAdmin = document.getElementById('btn-toggle-admin');
    const adminDot = document.getElementById('admin-dot');
    const adminTxt = document.getElementById('admin-txt');
    
    const panelAdminTotales = document.getElementById('panel-admin-totales');
    const panelHistorialAdmin = document.getElementById('panel-historial-admin');
    
    const nuevoUsuarioInput = document.getElementById('nuevo-usuario-input');
    const btnAddUser = document.getElementById('btn-add-user');

    const fotoInput = document.getElementById('foto-input');
    const btnTomarFoto = document.getElementById('btn-tomar-foto');
    const previewContainer = document.getElementById('preview-container');
    const fotoPreview = document.getElementById('foto-preview');
    const watermarkTextPreview = document.getElementById('watermark-text-preview');
    const watermarkCanvas = document.getElementById('watermark-canvas');

    let fotoProcesadaDataUrl = "";

    const resetFechaHoy = () => { fechaInput.value = new Date().toISOString().slice(0, 10); };
    resetFechaHoy();

    // Base de datos persistente en LocalStorage
    let historial = JSON.parse(localStorage.getItem('tt_emp_data') || '[]');
    let usuariosSistema = JSON.parse(localStorage.getItem('tt_emp_users') || '["Juan Perez", "Maria Gomez"]');
    let tarifa = parseFloat(localStorage.getItem('tt_emp_tarifa') || '22.01');
    tarifaInput.value = tarifa;

    const getHM = () => {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };

    // Actualizar nombres en el selector
    const renderUsuariosSelect = () => {
      nombreSelect.innerHTML = usuariosSistema.map(u => `<option value="${u}">${u}</option>`).join('');
    };

    // Agregar Usuario (Solo Admin)
    btnAddUser.onclick = () => {
      const nuevo = nuevoUsuarioInput.value.trim();
      if(nuevo && !usuariosSistema.includes(nuevo)) {
        usuariosSistema.push(nuevo);
        localStorage.setItem('tt_emp_users', JSON.stringify(usuariosSistema));
        renderUsuariosSelect();
        nuevoUsuarioInput.value = "";
        renderApp();
      }
    };

    // Forzar marcaje de salida manual
    document.getElementById('btn-now-salida').onclick = () => {
      salidaInput.value = getHM();
    };

    // --- INTERRUPTOR DE ADMIN / TRABAJADOR ---
    btnToggleAdmin.onclick = () => {
      if (!esAdmin) {
        const pass = prompt("Clave de Administrador:");
        if (pass === CLAVE_ADMIN) {
          esAdmin = true;
          actualizarModo();
        } else { alert("Clave Errónea."); }
      } else {
        esAdmin = false;
        actualizarModo();
      }
    };

    const actualizarModo = () => {
      if (esAdmin) {
        adminDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        adminTxt.innerText = "Administrador";
        adminTxt.className = "text-emerald-400";
        fechaInput.disabled = false;
        entradaInput.disabled = false;
        salidaInput.disabled = false;
        panelAdminTotales.classList.remove('hidden');
        panelHistorialAdmin.classList.remove('hidden');
      } else {
        adminDot.className = "w-2 h-2 rounded-full bg-zinc-600";
        adminTxt.innerText = "Trabajador";
        adminTxt.className = "text-zinc-400";
        fechaInput.disabled = true;
        entradaInput.disabled = true;
        salidaInput.disabled = true;
        resetFechaHoy();
        panelAdminTotales.classList.add('hidden');
        panelHistorialAdmin.classList.add('hidden');
      }
      renderApp();
    };

    // --- PROCESAMIENTO AUTOMÁTICO DE FOTO Y HORA ENTRADA (Puntos 1 y 1.1) ---
    btnTomarFoto.onclick = () => fotoInput.click();

    fotoInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const ctx = watermarkCanvas.getContext('2d');
          const maxDim = 500; // Optimizar almacenamiento
          let w = img.width, h = img.height;
          if (w > h ? w > maxDim : h > maxDim) {
            if (w > h) { h *= maxDim / w; w = maxDim; } else { w *= maxDim / h; h = maxDim; }
          }
          watermarkCanvas.width = w; watermarkCanvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          // Captura automática e inalterable de la hora de entrada al tomar la foto
          const horaFichada = getHM();
          entradaInput.value = horaFichada;

          const ahora = new Date();
          const marcaTexto = `📸 ENTRADA: ${ahora.toLocaleDateString('es-MX')} - ${ahora.toLocaleTimeString('es-MX')} | ${nombreSelect.value}`;

          ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
          ctx.fillRect(0, h - 30, w, 30);
          ctx.fillStyle = "#34d399"; // Verde esmeralda intocable
          ctx.font = "bold 12px monospace";
          ctx.fillText(marcaTexto, 10, h - 10);

          fotoProcesadaDataUrl = watermarkCanvas.toDataURL('image/jpeg', 0.7);
          fotoPreview.src = fotoProcesadaDataUrl;
          watermarkTextPreview.innerText = marcaTexto;
          previewContainer.classList.remove('hidden');
          btnTomarFoto.innerText = "🔄 Foto Capturada Exitosamente";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // --- RENDERIZADO DEL PANEL DE ADMINISTRACIÓN POR PESTAÑAS (Punto 3) ---
    const renderApp = () => {
      localStorage.setItem('tt_emp_data', JSON.stringify(historial));
      localStorage.setItem('tt_emp_tarifa', tarifa.toString());

      if (!esAdmin) return;

      // Obtener trabajadores con asistencias reales
      const trabajadoresActivos = [...new Set(historial.map(item => item.nombre))];
      if (trabajadoresActivos.length > 0 && !usuarioSeleccionadoTab) {
        usuarioSeleccionadoTab = trabajadoresActivos[0];
      }

      // Render de pestañas
      tabsTrabajadores.innerHTML = trabajadoresActivos.map(t => {
        const activeClass = usuarioSeleccionadoTab === t ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-zinc-900 text-zinc-400 border-zinc-800';
        return `<button onclick="cambiarTab('${t}')" class="px-3 py-1.5 text-xs font-extrabold rounded-xl border ${activeClass} whitespace-nowrap">${t}</button>`;
      }).join('');

      // Filtrar el historial por la pestaña activa
      const registrosFiltrados = historial.filter(item => item.nombre === usuarioSeleccionadoTab);
      historialLista.innerHTML = '';
      let totalHorasFiltro = 0;

      if (registrosFiltrados.length === 0) {
        historialLista.innerHTML = `<div class="bg-zinc-900/30 border border-dashed border-zinc-800/60 rounded-2xl p-6 text-center text-xs text-zinc-600 font-medium">Sin registros guardados esta semana para este empleado.</div>`;
      } else {
        registrosFiltrados.forEach((item) => {
          const [eH, eM] = item.entrada.split(':').map(Number);
          let [sH, sM] = item.salida.split(':').map(Number);
          let diffMin = (sH * 60 + sM) - (eH * 60 + eM);
          if (diffMin <= 0) diffMin += 24 * 60;

          const horasNetas = Math.max(0, (diffMin - item.descanso) / 60);
          totalHorasFiltro += horasNetas;
          const pagoDia = horasNetas * tarifa;

          const [y, m, d] = item.fecha.split('-');
          const fechaFormato = new Date(y, m - 1, d).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });

          historialLista.innerHTML += `
            <div class="bg-zinc-900/50 border border-zinc-800/80 p-4 rounded-2xl flex flex-col gap-2 relative shadow-sm">
              <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>
              <div class="flex items-start justify-between pl-2">
                <div>
                  <span class="text-xs font-black text-white capitalize">${fechaFormato}</span>
                  <div class="flex gap-2.5 text-[10px] text-zinc-400 mt-1 font-bold">
                    <span>Entrada: <strong class="text-indigo-400">${item.entrada}</strong></span>
                    <span>Salida: <strong class="text-rose-400">${item.salida || '--:--'}</strong></span>
                    <span>Descanso: <strong class="text-zinc-500">${item.descanso}m</strong></span>
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-sm font-black text-emerald-400 block">$${pagoDia.toFixed(2)}</span>
                  <span class="text-[10px] text-zinc-500 font-bold block">${horasNetas.toFixed(2)} hrs</span>
                </div>
              </div>
              <div class="pl-2 mt-1">
                <img src="${item.foto}" class="w-full h-32 object-cover rounded-xl border border-zinc-800/80">
              </div>
              <button onclick="eliminarRegistro(${item.id})" class="absolute top-2 right-2 text-zinc-700 hover:text-rose-400 font-bold text-xs">✕</button>
            </div>
          `;
        });
      }

      totalHorasTxt.innerText = `${totalHorasFiltro.toFixed(2)}h`;
      totalDineroTxt.innerText = `$${(totalHorasFiltro * tarifa).toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
    };

    window.cambiarTab = (nombre) => {
      usuarioSeleccionadoTab = nombre;
      renderApp();
    };

    tarifaInput.oninput = (e) => {
      tarifa = parseFloat(e.target.value) || 0;
      renderApp();
    };

    // --- ACCIÓN DE GUARDADO Y WHATSAPP (Punto 2) ---
    btnGuardar.onclick = () => {
      if (!entradaInput.value) {
        alert('Es obligatorio tomarse la foto de evidencia para registrar la entrada.');
        return;
      }
      if (!salidaInput.value) {
        alert('Por favor marca tu hora de salida antes de guardar el turno.');
        return;
      }

      const nuevoTurno = {
        id: Date.now(),
        nombre: nombreSelect.value,
        fecha: fechaInput.value,
        entrada: entradaInput.value,
        salida: salidaInput.value,
        descanso: parseInt(descansoInput.value) || 0,
        foto: fotoProcesadaDataUrl
      };

      historial.unshift(nuevoTurno);
      usuarioSeleccionadoTab = nombreSelect.value;

      // Generación automática del mensaje para WhatsApp (Punto 2)
      const msg = `📌 *TimeTracker Pro*\n⚡ *Turno Iniciado / Guardado*\n👤 *Trabajador:* ${nuevoTurno.nombre}\n📅 *Fecha:* ${nuevoTurno.fecha}\n🛫 *Entrada:* ${nuevoTurno.entrada}\n🛬 *Salida:* ${nuevoTurno.salida}\n☕ *Descanso:* ${nuevoTurno.descanso} min`;
      const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
      
      alert("Turno registrado exitosamente localmente. Se procederá a enviar confirmación por WhatsApp.");
      window.open(whatsappUrl, '_blank');

      // Limpieza de campos de fichaje
      fotoProcesadaDataUrl = "";
      previewContainer.classList.add('hidden');
      entradaInput.value = "";
      salidaInput.value = "";
      btnTomarFoto.innerText = "📷 Capturar Foto para Registrar Entrada";
      
      renderApp();
    };

    // --- ARCHIVAR SEMANA / HISTORIALES SEPARADOS (Punto 4) ---
    btnArchivarSemana.onclick = () => {
      if (confirm('¿Deseas archivar y dar por cerrada la semana de comisiones actual? Los totales volverán a comenzar desde ceros.')) {
        let archivadosSemanas = JSON.parse(localStorage.getItem('tt_emp_archivados') || '[]');
        archivadosSemanas.push({
          semanaCierreId: Date.now(),
          fechaArchivo: new Date().toLocaleDateString('es-MX'),
          datos: historial
        });
        localStorage.setItem('tt_emp_archivados', JSON.stringify(archivadosSemanas));
        
        historial = []; // Limpiamos la semana en curso
        usuarioSeleccionadoTab = "";
        renderApp();
        alert("Semana archivada exitosamente en el historial del negocio.");
      }
    };

    window.eliminarRegistro = (id) => {
      if(confirm("¿Seguro que deseas remover este registro?")){
        historial = historial.filter(item => item.id !== id);
        renderApp();
      }
    };

    // Inicialización de la WebApp
    renderUsuariosSelect();
    actualizarModo();
  </script>
</body>
</html>
